# ASM test scenario: clone_item.asm
# Hook at org $00ABFC (low_y) — sets carried item Y when clone is carrying.

[patch]
file = "resources/patches/clone_item.asm"
hook_pc = "00ABFC"  # re-check against built ROM if hook moves

[ram]
# SA-1 RAM (!addr = $6000); addresses from clone_item.asm
clone_index = "41A01A"
clone_carried_item_index = "41B82E"
sprite_low_y_table = "322C"

[checks.carrying_item]
description = "When clone carries item, item sprite low Y matches clone low Y"
precondition = "CloneCarriedItemIndex != $FF"
steps = [
  "Load savestate clone_item_carry",
  "Set breakpoint on low_y hook if not already hit",
  "Step frames and verify get_cpu_state X matches CloneIndex",
  "Read CloneCarriedItemIndex; expect != $FF",
  "After hook runs, read sprite low Y for carried item slot; expect match"
]

[checks.not_carrying]
description = "When not carrying, hook returns without modifying item Y"
precondition = "CloneCarriedItemIndex == $FF"
steps = [
  "Load savestate clone_item_no_carry",
  "Breakpoint on low_y; verify early BNE .return path",
  "CloneCarriedItemIndex should read $FF"
]
