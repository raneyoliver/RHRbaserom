# Savestate registry for ASM test scenarios.
# Create states in Mesen (File -> Save State), then copy .mst files here.
# Register each file below so launch/load scripts can reference them by name.

[luigi_item_hold]
file = "tools/test/savestates/luigi_item_hold.mst"
description = "Luigi holding an item; tests luigi_item.asm Y-position hook"
patch = "resources/patches/luigi_item.asm"
level = "TBD"
notes = "Save right before or during item hold so low_y hook can be stepped"

[luigi_item_no_hold]
file = "tools/test/savestates/luigi_item_no_hold.mst"
description = "Luigi active but not holding; control case for luigi_item.asm"
patch = "resources/patches/luigi_item.asm"
level = "TBD"
notes = "LuigiHeldItemIndex should be $FF"
